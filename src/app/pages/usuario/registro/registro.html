<div class="registro-page">

  <div class="registro-card">

    <div class="registro-header">

      <span class="registro-tag">
        CREAR CUENTA
      </span>

      <h1>
        Únete a <em>nosotros</em>
      </h1>

      <p>
        Crea tu cuenta para comenzar.
      </p>

    </div>


    <form
      class="registro-form"
      (ngSubmit)="registrar()"
    >

      <!-- NOMBRE -->

      <div class="registro-field">

        <label for="nombre">
          Nombre
        </label>

        <input
          id="nombre"
          type="text"
          name="nombre"
          [(ngModel)]="nombre"
          placeholder="Tu nombre"
          autocomplete="name"
        >

      </div>


      <!-- EMAIL -->

      <div class="registro-field">

        <label for="email">
          Correo electrónico
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="correo@ejemplo.com"
          autocomplete="email"
        >

      </div>


      <!-- PASSWORD -->

      <div class="registro-field">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Mínimo 6 caracteres"
          autocomplete="new-password"
        >

      </div>


      <!-- CONFIRMAR PASSWORD -->

      <div class="registro-field">

        <label for="confirmarPassword">
          Confirmar contraseña
        </label>

        <input
          id="confirmarPassword"
          type="password"
          name="confirmarPassword"
          [(ngModel)]="confirmarPassword"
          placeholder="Repite tu contraseña"
          autocomplete="new-password"
        >

      </div>


      <!-- ERROR -->

      @if (error) {

        <p class="registro-error">
          {{ error }}
        </p>

      }


      <!-- ÉXITO -->

      @if (exito) {

        <p class="registro-exito">
          {{ exito }}
        </p>

      }


      <!-- BOTÓN -->

      <button
        class="registro-button"
        type="submit"
        [disabled]="cargando"
      >

        @if (cargando) {
          Creando cuenta...
        } @else {
          Crear cuenta
        }

      </button>

    </form>


    <div class="registro-login">

      <span>
        ¿Ya tienes una cuenta?
      </span>

      <button
        type="button"
        (click)="volverLogin()"
      >
        Iniciar sesión
      </button>

    </div>

  </div>

</div>
