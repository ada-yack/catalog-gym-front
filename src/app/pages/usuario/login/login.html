<div class="login">

  <div class="login__container">

    <div class="login__heading">

      <span class="login__tag">
        BIENVENIDO
      </span>

      <h1>
        Iniciar <em>Sesión</em>
      </h1>

      <p>
        Ingresa a tu cuenta para continuar.
      </p>

    </div>


    <form
      class="login__form"
      (ngSubmit)="iniciarSesion()"
    >

      <!-- EMAIL -->

      <div class="login__field">

        <label for="email">
          Correo electrónico
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="correo@ejemplo.com"
          autocomplete="email"
        >

      </div>


      <!-- PASSWORD -->

      <div class="login__field">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          autocomplete="current-password"
        >

      </div>


      <!-- ERROR -->

      @if (error) {

        <p class="login__error">
          {{ error }}
        </p>

      }


      <!-- BOTÓN -->

      <button
        type="submit"
        [disabled]="cargando"
      >

        @if (cargando) {
          Iniciando sesión...
        } @else {
          Iniciar sesión
        }

      </button>

    </form>


    <!-- GOOGLE LO DEJAMOS PARA DESPUÉS -->

    <div class="login__google">

      <button
        type="button"
        disabled
      >
        Continuar con Google
      </button>

    </div>

  </div>

</div>
